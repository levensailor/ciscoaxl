site_name: ciscoaxl
repo_url: https://github.com/levensailor/ciscoaxl

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: teal
  features:
    - navigation.sections
    - navigation.top

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_root_heading: false
            show_source: false
            show_bases: false
            heading_level: 3

nav:
  - Introduction: index.md
  - Getting Started: intro.md
  - Installation: install.md
  - Examples: examples.md
  - Full API Reference: api.md
  - API Reference:
    - Users: users.md
    - Devices: devices.md
    - Device Pools: devicepools.md
    - Directory Numbers: dn.md
    - Partitions: partitions.md
    - Calling Search Spaces: css.md
    - Trunks and Gateways: trunks.md
    - Locations: locations.md
    - Regions: regions.md
    - Translation Patterns: translations.md
    - Transformation Patterns: xform.md
    - Route Patterns: routepatterns.md
    - CTI Route Points: cti.md
    - Media Resources: media.md
    - Call Pickup: callpickup.md
    - Call Routing: routing.md
    - Call Hunting: hunt.md
    - Line Groups: linegroup.md
    - Call Manager Groups: cm.md
    - LDAP: ldap.md
    - SQL: sql.md
    - UC Services: ucservice.md
    - Voicemail: vm.md
    - Remote Destinations: rd.md
  - About: about.md
